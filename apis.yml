aid: scandit
name: Scandit
description: >-
  Scandit is the smart data capture company, founded in 2009 and headquartered in
  Zurich, Switzerland. Its vision-AI Smart Data Capture platform turns smartphones,
  handheld computers, wearables, drones and fixed cameras into high-performance
  scanners that read barcodes, text, IDs and objects with unmatched speed and
  accuracy. Scandit is delivered to developers as a first-party Data Capture SDK
  across iOS, Android, Web, React Native, Flutter, Cordova, Capacitor and .NET/MAUI,
  plus hosted products like ID Bolt for drop-in website ID scanning. Products
  include SparkScan, Barcode Capture, MatrixScan (AR/Count/Batch), Smart Label
  Capture and ID Capture. Authentication is a per-application license key, and
  recognition runs on-device at the edge. Customers include Walmart, Instacart,
  Levi Strauss & Co., Sephora, Lufthansa and FedEx.
